name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
        with:
          gradle-version: 8.8

      - name: Build
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: structurecraft-jar
          path: build/libs/*.jar

  smoke-test:
    name: server smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Read pinned versions from gradle.properties
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          LOADER=$(grep '^loader_version=' gradle.properties | cut -d= -f2)
          FABRIC_API=$(grep '^fabric_version=' gradle.properties | cut -d= -f2)
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          echo "loader=$LOADER" >> "$GITHUB_OUTPUT"
          echo "fabric_api=$FABRIC_API" >> "$GITHUB_OUTPUT"
          echo "mc=$MC" >> "$GITHUB_OUTPUT"
          echo "Pinned: MC=$MC loader=$LOADER fabric-api=$FABRIC_API"

      - name: Download built mod jar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: structurecraft-jar
          path: artifact

      - name: Prepare server directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server/mods
          # Copy only the main mod jar (skip -sources).
          find artifact -name '*.jar' ! -name '*-sources.jar' -exec cp {} server/mods/ \;
          test "$(find server/mods -maxdepth 1 -name '*.jar' | wc -l)" -eq 1
          ls -la server/mods

      - name: Download Fabric server launcher (pinned loader)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            -o server/server.jar \
            "https://meta.fabricmc.net/v2/versions/loader/${{ steps.versions.outputs.mc }}/${{ steps.versions.outputs.loader }}/1.0.1/server/jar"
          test -s server/server.jar

      - name: Download Fabric API (pinned version)
        shell: bash
        run: |
          set -euo pipefail
          FABRIC_API='${{ steps.versions.outputs.fabric_api }}'
          RESPONSE=$(curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%22${{ steps.versions.outputs.mc }}%22%5D&loaders=%5B%22fabric%22%5D")
          URL=$(jq -er --arg v "$FABRIC_API" '[.[] | select(.version_number == $v)][0].files[0].url' <<< "$RESPONSE")
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            -o server/mods/fabric-api.jar "$URL"
          test -s server/mods/fabric-api.jar

      - name: Run dedicated server until fully started
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          PID=''
          cleanup() {
            if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          echo "eula=true" > eula.txt
          java -Xmx2G -jar server.jar --nogui > server_out.log 2>&1 &
          PID=$!
          STARTED=0
          for _ in $(seq 1 60); do
            if grep -q 'Done (' server_out.log; then STARTED=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 5
          done
          cleanup
          trap - EXIT

          echo "===== OTOMATIK KONTROL ====="
          MOD_LOADED=$(grep -ci 'structurecraft' server_out.log || true)
          CRASHED=0
          compgen -G 'crash-reports/*.txt' > /dev/null && CRASHED=1
          grep -q 'Failed to start the minecraft server' server_out.log && CRASHED=1

          R1=$([ "$STARTED" -eq 1 ] && echo PASS || echo FAIL)
          R2=$([ "$MOD_LOADED" -gt 0 ] && echo PASS || echo FAIL)
          R3=$([ "$CRASHED" -eq 0 ] && echo PASS || echo FAIL)
          echo "Server fully started (Done): $R1"
          echo "Mod 'structurecraft' loaded:  $R2"
          echo "No crash detected:            $R3"
          {
            echo "## Smoke test (MC ${{ steps.versions.outputs.mc }} / loader ${{ steps.versions.outputs.loader }} / fabric-api ${{ steps.versions.outputs.fabric_api }})"
            echo "- Server fully started: **$R1**"
            echo "- Mod loaded: **$R2**"
            echo "- No crash: **$R3**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "----- structurecraft log lines -----"
          grep -i 'structurecraft' server_out.log || true
          echo "----- errors (if any) -----"
          grep -iE 'ERROR|Exception' server_out.log | head -30 || true

          if [ "$STARTED" -eq 1 ] && [ "$MOD_LOADED" -gt 0 ] && [ "$CRASHED" -eq 0 ]; then
            echo "RESULT: PASS"
          else
            echo "RESULT: FAIL"
            tail -80 server_out.log
            exit 1
          fi

      - name: Upload server log and crash reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-log
          path: |
            server/server_out.log
            server/crash-reports/
          if-no-files-found: ignore
          retention-days: 14
